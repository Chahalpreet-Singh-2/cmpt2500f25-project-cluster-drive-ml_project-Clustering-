# Global configuration
global:
  scrape_interval: 15s        # How often Prometheus scrapes metrics
  evaluation_interval: 15s    # How often alert rules are evaluated

# Load alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# What to scrape
scrape_configs:

  # Prometheus scrapes itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Your ML API inside Docker
  - job_name: 'ml-api'
    scrape_interval: 5s       # collect API metrics more frequently
    metrics_path: /metrics
    static_configs:
      - targets: ['ml-app:5000']   # IMPORTANT: app = name of your Flask service in docker-compose
